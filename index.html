<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KRONEN – budget for unge</title>
<meta name="theme-color" content="#5b3df5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>
  // Mobil/tablet: gå direkte til appen
  if (matchMedia('(pointer:coarse)').matches || innerWidth < 760) location.replace('app.html' + location.hash);
</script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1d1b26;
  background:radial-gradient(1200px 600px at 80% -10%,#e3dcff,transparent),radial-gradient(900px 500px at -10% 110%,#ffe2cc,transparent),#f6f4ef;
  display:flex;align-items:center;justify-content:center;gap:72px;padding:32px}
.info{max-width:380px}
.logo{font-weight:900;letter-spacing:.08em;font-size:34px}.logo span{color:#5b3df5}
h1{font-size:40px;line-height:1.1;margin:14px 0}
p{color:#5c5968;font-size:17px;line-height:1.5}
.phone{width:390px;height:844px;border-radius:56px;background:#111;padding:14px;box-shadow:0 40px 80px rgba(30,20,80,.25),inset 0 0 0 2px #333;position:relative;flex:none}
.phone::before{content:"";position:absolute;top:24px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#111;border-radius:20px;z-index:2}
.phone iframe{width:100%;height:100%;border:0;border-radius:42px;background:#f6f4ef}
@media (max-height:900px){.phone{transform:scale(calc((100vh - 40px)/844px));transform-origin:center}}
@media (max-width:1000px){.info{display:none}}
</style>
</head>
<body>
  <div class="info">
    <div class="logo">KRO<span>N</span>EN</div>
    <h1>Budget for unge – nemt og overskueligt.</h1>
    <p>Se med det samme, hvor mange penge du har tilbage. Sæt sparemål, og få besked, før du bruger for meget.</p>
  </div>
  <div class="phone"><iframe src="app.html" title="KRONEN app"></iframe></div>
</body>
</html>
