<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KRONEN – budget for unge</title>
<meta name="theme-color" content="#5b3df5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>
  // Mobil/tablet: gå direkte til appen
  if (matchMedia('(pointer:coarse)').matches || innerWidth < 760) location.replace('app.html' + location.hash);
</script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1d1b26;
  background:radial-gradient(1200px 600px at 80% -10%,#e3dcff,transparent),radial-gradient(900px 500px at -10% 110%,#ffe2cc,transparent),#f6f4ef;
  display:flex;align-items:center;justify-content:center;overflow:hidden;height:100vh}
.phone{width:390px;height:844px;border-radius:56px;background:#111;padding:14px;box-shadow:0 40px 80px rgba(30,20,80,.25),inset 0 0 0 2px #333;position:relative;flex:none;transform-origin:center}
.phone::before{content:"";position:absolute;top:24px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#111;border-radius:20px;z-index:2}
.screen{width:100%;height:100%;border-radius:42px;overflow:hidden;background:#f6f4ef;isolation:isolate}
.phone iframe{width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
  <div class="phone"><div class="screen"><iframe src="app.html" title="KRONEN app"></iframe></div></div>
<script>
  // Lad telefonen fylde skærmens højde
  const fit=()=>{const ph=document.querySelector('.phone');const h=Math.min(innerHeight-24,(innerWidth-24)*844/390);
    ph.style.height=h+'px';ph.style.width=(h*390/844)+'px'};
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
