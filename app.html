<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KRONEN – budget for unge</title>
<meta name="theme-color" content="#f7f7f9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="KRONEN">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f7f9; --card:#fff; --ink:#111318; --muted:#717684; --faint:#a3a7b3; --line:#ececf1; --soft:#f2f2f6;
  --brand:#4f46e5; --brand-soft:#eef0ff; --ok:#12b76a; --warn:#f79009; --bad:#f04438;
  --r:20px;
}
*{box-sizing:border-box}
html,body{overscroll-behavior-y:none}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;font-size:15px;letter-spacing:-.005em}
button{font:inherit;color:inherit}
a{color:var(--brand);text-decoration:none;font-weight:600}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{max-width:480px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 20px calc(110px + env(safe-area-inset-bottom));min-height:100vh}
.framed .app{padding-top:56px}

/* header */
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.hello small{display:block;color:var(--muted);font-size:13px;font-weight:500;text-transform:capitalize}
.hello b{font-size:22px;font-weight:700;letter-spacing:-.02em}
.avatar{width:40px;height:40px;border-radius:50%;border:0;background:var(--brand-soft);color:var(--brand);font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative}
.avatar .star{position:absolute;right:-2px;bottom:-2px;width:16px;height:16px;border-radius:50%;background:var(--brand);color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}

/* cards */
.card{background:var(--card);border-radius:var(--r);padding:18px;margin-bottom:14px;border:1px solid var(--line)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 12px}
.sec h2{font-size:16px;font-weight:700;margin:0;letter-spacing:-.01em}
.sec a,.sec span{font-size:13px}
.sec span{color:var(--muted);font-weight:500}
.page-title{font-size:26px;font-weight:800;letter-spacing:-.03em;margin:0 0 18px}

/* ring */
.hero{text-align:center;padding:22px 18px 18px}
.ring{position:relative;width:230px;height:230px;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .l{color:var(--muted);font-size:13px;font-weight:500}
.ring .a{font-size:40px;font-weight:800;letter-spacing:-.04em;margin:2px 0;font-variant-numeric:tabular-nums}
.ring .d{color:var(--muted);font-size:12px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.trio div+div{border-left:1px solid var(--line)}
.trio small{display:block;color:var(--muted);font-size:12px;font-weight:500;margin-bottom:2px}
.trio b{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}

/* lists */
.row{display:flex;align-items:center;gap:12px;padding:11px 0}
.row+.row{border-top:1px solid var(--line)}
.row .g{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--muted);margin-top:1px}
.row .v{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.ico{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;font-weight:700;font-size:14px}
.ico svg.i{width:19px;height:19px}
.icon-btn{border:0;background:none;color:var(--faint);cursor:pointer;padding:6px;border-radius:10px;display:flex}
.icon-btn:hover{background:var(--soft);color:var(--ink)}
.icon-btn svg.i{width:18px;height:18px}
.bar{height:6px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:99px;transition:width .4s}
.empty{color:var(--muted);font-size:14px;padding:4px 0;line-height:1.5}

/* alert */
.note{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;margin-bottom:14px;font-size:14px;font-weight:500}
.note svg.i{width:19px;height:19px}
.note.warn{background:#fff6e8;color:#93530a}
.note.bad{background:#fff0ef;color:#a8231b}
.note.info{background:var(--brand-soft);color:#3730a3}

/* buttons/forms */
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:600;cursor:pointer;background:var(--brand);color:#fff;font-size:15px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.sec2{background:var(--soft);color:var(--ink)}
.btn.line{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.sm{width:auto;padding:8px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.55;cursor:default}
form{display:flex;flex-direction:column;gap:12px}
label{font-size:13px;color:var(--muted);font-weight:500;display:flex;flex-direction:column;gap:6px}
input,select{font:inherit;font-size:16px;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);outline:none;width:100%}
input:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tabs{display:flex;background:var(--soft);border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;padding:9px 4px;border-radius:10px;font-weight:600;cursor:pointer;color:var(--muted);font-size:13.5px}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.08)}

/* nav */
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav .in{display:flex;max-width:480px;margin:0 auto;align-items:center}
nav button{flex:1;border:0;background:none;padding:10px 0 12px;font-size:11px;color:var(--faint);cursor:pointer;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--brand)}
nav .add{flex:none;width:52px;height:52px;border-radius:18px;background:var(--brand);color:#fff;margin:0 6px;padding:0;justify-content:center;box-shadow:0 6px 16px rgba(79,70,229,.35)}
nav .add svg.i{width:26px;height:26px;stroke-width:2.2}

/* sheet */
.modal{position:fixed;inset:0;background:rgba(17,19,24,.4);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .22s ease-out}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sheet h3{margin:0 0 16px;font-size:20px;font-weight:700;letter-spacing:-.02em}
@keyframes up{from{transform:translateY(30px);opacity:.4}}

.lockcard{text-align:center;padding:26px 18px}
.lockcard .ico{margin:0 auto 10px;background:var(--brand-soft);color:var(--brand)}
.lockcard p{color:var(--muted);font-size:14px;margin:4px 0 14px}
.pro{font-size:11px;font-weight:700;color:var(--brand);background:var(--brand-soft);padding:3px 7px;border-radius:6px;letter-spacing:.02em}
.toast{position:fixed;left:50%;transform:translate(-50%,10px);bottom:calc(96px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;padding:11px 16px;border-radius:14px;font-size:14px;font-weight:500;opacity:0;transition:.25s;pointer-events:none;z-index:30;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.chart text{fill:var(--faint);font-size:10px;font-family:Inter,sans-serif}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.mini div{background:var(--soft);border-radius:14px;padding:12px}
.mini small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.mini b{font-size:17px;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;margin-top:12px}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 12px;font-weight:600;font-size:13px;cursor:pointer}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:30px;height:30px;border-radius:50%;border:0;cursor:pointer}
.swatches button.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ink)}
textarea{width:100%;height:140px;font:12px ui-monospace,monospace;border-radius:14px;border:1px solid var(--line);background:var(--soft);color:var(--ink);padding:12px}
.feat{display:flex;gap:12px;padding:10px 0;align-items:flex-start}
.feat .ico{width:34px;height:34px;background:var(--brand-soft);color:var(--brand)}
.feat b{display:block;font-size:14.5px}
.feat small{color:var(--muted);font-size:13px}

/* auth */
.auth{min-height:100vh;display:flex;flex-direction:column;justify-content:center;max-width:400px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 24px calc(28px + env(safe-area-inset-bottom))}
.auth .mark{width:64px;height:64px;border-radius:20px;margin-bottom:22px}
.auth h1{font-size:28px;font-weight:800;letter-spacing:-.03em;margin:0 0 6px}
.auth p.sub{color:var(--muted);margin:0 0 24px;line-height:1.5}
.or{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:12px;margin:4px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.err{color:var(--bad);font-size:13.5px;min-height:0}
.small-links{display:flex;justify-content:space-between;font-size:13.5px;margin-top:4px}
.loader{min-height:100vh;display:flex;align-items:center;justify-content:center}
.spin{width:32px;height:32px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="root"><div class="loader"><div class="spin"></div></div></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ================= Ikoner =================
const P={
  home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  wallet:'<rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/>',
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
  chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  bell:'<path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4zM10 21h4"/>',
  alert:'<path d="M12 3 2 20h20zM12 10v4M12 17.5v.01"/>',
  left:'<path d="M15 6l-6 6 6 6"/>', right:'<path d="M9 6l6 6-6 6"/>',
  star:'<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
  file:'<path d="M14 3H6v18h12V7zM14 3v4h4M9 13h6M9 17h6"/>',
  repeat:'<path d="M17 2l3 3-3 3M3 11V9a4 4 0 0 1 4-4h13M7 22l-3-3 3-3M21 13v2a4 4 0 0 1-4 4H4"/>',
  coin:'<circle cx="12" cy="12" r="9"/><path d="M14.5 9a2.5 2 0 0 0-2.5-1.5c-1.5 0-2.5.8-2.5 2s1 1.7 2.5 2 2.5.8 2.5 2-1 2-2.5 2A2.5 2 0 0 1 9.5 15M12 6v1.5M12 16.5V18"/>',
  out:'<path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/>',
  share:'<path d="M12 3v12M8 7l4-4 4 4M6 11H4v10h16V11h-2"/>',
  check:'<path d="M5 12l5 5 9-10"/>',
};
const ic=(n,extra='')=>`<svg class="i" viewBox="0 0 24 24" ${extra}>${P[n]}</svg>`;

// ================= Hjælpere =================
const COLORS=['#4f46e5','#f97316','#12b76a','#ec4899','#0ea5e9','#eab308','#8b5cf6','#64748b'];
const FREE={cats:3,goals:1};
const now=new Date();
const ym=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const iso=d=>ym(d)+'-'+String(d.getDate()).padStart(2,'0');
const curYM=ym(now);
const uid=()=>Math.random().toString(36).slice(2,10);
const kr=n=>new Intl.NumberFormat('da-DK',{maximumFractionDigits:0}).format(Math.round(n))+' kr.';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const monthName=(y,m)=>new Date(y,m,1).toLocaleDateString('da-DK',{month:'long',year:'numeric'});
const dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
const $=s=>document.querySelector(s);
const tint=(hex,a=.12)=>hex+Math.round(a*255).toString(16).padStart(2,'0');
const framed=window.self!==window.top;
if(framed) document.documentElement.classList.add('framed');

function emptyState(name){
  return {name:name||'',premium:false,incomes:[],fixed:[],tx:[],goals:[],
    cats:[{id:uid(),name:'Mad',limit:1000,color:COLORS[0]},{id:uid(),name:'Fritid',limit:600,color:COLORS[1]},{id:uid(),name:'Tøj',limit:400,color:COLORS[2]}]};
}
function demoData(s){
  const notes=[['Netto','Kantine','Pizza','7-Eleven'],['Biograf','Koncert','Bowling','Spil'],['Sneakers','Hoodie','T-shirt']];
  s.incomes=[{id:uid(),name:'Fritidsjob',kind:'Løn',amount:3200},{id:uid(),name:'Lommepenge',kind:'Lommepenge',amount:500}];
  s.fixed=[{id:uid(),name:'Telefon',amount:129,day:5},{id:uid(),name:'Spotify',amount:59,day:12},{id:uid(),name:'Netflix',amount:89,day:Math.min(28,now.getDate()+3)}];
  s.tx=[];
  for(let back=9;back>=0;back--){
    const d=new Date(now.getFullYear(),now.getMonth()-back,1);
    const max=back===0?now.getDate():28, n=back===0?6:9+Math.floor(Math.random()*5);
    for(let i=0;i<n;i++){const k=Math.floor(Math.random()*Math.min(3,s.cats.length));const c=s.cats[k];
      s.tx.push({id:uid(),date:ym(d)+'-'+String(1+Math.floor(Math.random()*max)).padStart(2,'0'),cat:c.id,amount:40+Math.round(Math.random()*200),note:notes[k][Math.floor(Math.random()*notes[k].length)]})}
  }
  if(!s.goals.length) s.goals=[{id:uid(),name:'Ny telefon',target:4000,saved:1350,deposits:[]}];
  return s;
}

// ================= Login & lagring =================
const CFG=window.FIREBASE_CONFIG||{};
const hasFirebase=!!(CFG.apiKey&&window.firebase);
let auth=null, db=null, user=null, S=null, saveTimer=null;
if(hasFirebase){firebase.initializeApp(CFG);auth=firebase.auth();db=firebase.firestore();
  auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});}

const cacheKey=()=>'kronen:'+(user?user.uid:'demo');
function save(){
  try{localStorage.setItem(cacheKey(),JSON.stringify(S))}catch(e){}
  if(!db||!user) return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    db.collection('users').doc(user.uid).set({state:JSON.parse(JSON.stringify(S)),updatedAt:firebase.firestore.FieldValue.serverTimestamp()})
      .catch(e=>{console.error(e);toast('Kunne ikke gemme – tjek din forbindelse')});
  },500);
}
async function loadUser(u){
  user=u;
  $('#root').innerHTML='<div class="loader"><div class="spin"></div></div>';
  let cached=null;try{cached=JSON.parse(localStorage.getItem(cacheKey()))}catch(e){}
  try{
    const snap=await db.collection('users').doc(u.uid).get();
    if(snap.exists&&snap.data().state) S=snap.data().state;
    else{S=cached||emptyState(u.displayName||pendingName||'');save();}
  }catch(e){
    console.error(e);
    if(cached){S=cached;toast('Offline – viser dine gemte data')}
    else{S=emptyState(u.displayName||'');}
  }
  if(!S.name&&(u.displayName||pendingName)){S.name=u.displayName||pendingName;save();}
  startApp();
}
function startDemo(){
  user=null;try{S=JSON.parse(localStorage.getItem(cacheKey()))}catch(e){}
  if(!S) S=demoData(emptyState('Demo'));
  startApp();
}

// ---------- Login-skærm ----------
let authMode='login', pendingName='';
function authErr(e){
  const m={'auth/invalid-email':'E-mailadressen ser forkert ud.','auth/missing-password':'Skriv en adgangskode.',
    'auth/weak-password':'Adgangskoden skal være mindst 6 tegn.','auth/email-already-in-use':'Der findes allerede en konto med den e-mail. Log ind i stedet.',
    'auth/invalid-credential':'Forkert e-mail eller adgangskode.','auth/wrong-password':'Forkert e-mail eller adgangskode.','auth/user-not-found':'Der findes ingen konto med den e-mail.',
    'auth/too-many-requests':'For mange forsøg. Vent lidt og prøv igen.','auth/network-request-failed':'Ingen internetforbindelse.',
    'auth/popup-closed-by-user':'Login blev annulleret.','auth/unauthorized-domain':'Domænet er ikke godkendt i Firebase (se opsætning).',
    'auth/operation-not-allowed':'Denne login-metode er ikke slået til i Firebase.'};
  return m[e.code]||'Noget gik galt. Prøv igen.';
}
function renderAuth(){
  const signup=authMode==='signup';
  $('#root').innerHTML=`<div class="auth">
    <img class="mark" src="icons/icon-192.png" alt="">
    <h1>${signup?'Opret din konto':hasFirebase?'Velkommen tilbage':'Velkommen til KRONEN'}</h1>
    <p class="sub">${!hasFirebase?'Hold styr på dine penge – nemt og overskueligt.':signup?'Få styr på dine penge på 2 minutter. Dine data gemmes sikkert, så du kan bruge KRONEN på alle dine enheder.':'Log ind for at se dit budget.'}</p>
    ${hasFirebase?`
    <form id="authForm">
      ${signup?`<label>Fornavn<input name="name" autocomplete="given-name" required placeholder="Fx Emma"></label>`:''}
      <label>E-mail<input name="email" type="email" autocomplete="email" required placeholder="din@email.dk"></label>
      <label>Adgangskode<input name="pw" type="password" autocomplete="${signup?'new-password':'current-password'}" required minlength="6" placeholder="${signup?'Mindst 6 tegn':''}"></label>
      <div class="err" id="err"></div>
      <button class="btn" id="authBtn">${signup?'Opret konto':'Log ind'}</button>
      <div class="or">eller</div>
      <button type="button" class="btn line" onclick="googleLogin()">

        Fortsæt med Google</button>
      <div class="small-links">

  </div>`;
  const f=$('#authForm'); if(!f) return;

async function googleLogin(){
  const p=new firebase.auth.GoogleAuthProvider();
  try{await auth.signInWithPopup(p)}

    const el=$('#err'); if(el) el.textContent=authErr(e);
  }
}
async function resetPw(){
  const email=$('#authForm [name=email]').value.trim();

const incomeTotal=()=>S.incomes.reduce((a,b)=>a+b.amount,0);
const fixedTotal=()=>S.fixed.reduce((a,b)=>a+b.amount,0);
const txIn=m=>S.tx.filter(t=>t.date.startsWith(m));
const spentCat=(c,m=curYM)=>txIn(m).filter(t=>t.cat===c).reduce((a,b)=>a+b.amount,0);
const savedIn=m=>S.goals.flatMap(g=>g.deposits||[]).filter(d=>d.date.startsWith(m)).reduce((a,b)=>a+b.amount,0);
function month(m){const inc=incomeTotal(),fix=fixedTotal(),v=txIn(m).reduce((a,b)=>a+b.amount,0),sav=savedIn(m);return {inc,fix,var:v,sav,left:inc-fix-v-sav}}
function topWarning(){
  const s=month(curYM);
  if(s.inc&&s.left<0) return ['bad','Du har brugt '+kr(-s.left)+' mere, end du har.'];
  const over=S.cats.find(c=>c.limit&&spentCat(c.id)>c.limit);
  if(over) return ['bad',esc(over.name)+' er '+kr(spentCat(over.id)-over.limit)+' over grænsen.'];
  if(s.inc&&s.left<s.inc*.15) return ['warn','Kun '+kr(s.left)+' tilbage de næste '+(dim-now.getDate()+1)+' dage.'];
  const near=S.cats.find(c=>c.limit&&spentCat(c.id)>c.limit*.8);
  if(near) return ['warn',esc(near.name)+': '+Math.round(spentCat(near.id)/near.limit*100)+' % af grænsen er brugt.'];
  return null;
}
function upcoming(){
  const d=now.getDate();
  return S.fixed.map(f=>{let diff=f.day-d;if(diff<0)diff+=dim;return {...f,diff}}).filter(f=>f.diff<=7).sort((a,b)=>a.diff-b.diff);
}

function addTx(e){
  e.preventDefault();const f=new FormData(e.target);
  const t={id:uid(),amount:+f.get('amount'),cat:f.get('cat'),note:f.get('note').trim(),date:f.get('date')||iso(now)};
  const c=S.cats.find(c=>c.id===t.cat),before=spentCat(c.id);
  S.tx.push(t);save();closeSheet();render();
  const after=spentCat(c.id),left=month(curYM).left;

  else toast('Tilføjet · '+kr(left)+' tilbage');
}

let repOffset=0;
function vReport(){
  const d=new Date(now.getFullYear(),now.getMonth()+repOffset,1),m=ym(d),s=month(m);
  const parts=S.cats.map(c=>({n:c.name,col:c.color,v:spentCat(c.id,m)})).filter(p=>p.v>0);
  if(s.fix) parts.push({n:'Faste udgifter',col:'#94a3b8',v:s.fix});
  parts.sort((a,b)=>b.v-a.v);
  const tot=parts.reduce((a,b)=>a+b.v,0);
  let ang=0;const R=78,cx=100,cy=100,P=a=>[cx+R*Math.sin(a),cy-R*Math.cos(a)];
  const arcs=parts.length===1?`<circle cx="100" cy="100" r="${R}" fill="none" stroke="${parts[0].col}" stroke-width="22"/>`:parts.map(p=>{const a0=ang,a1=ang+p.v/tot*Math.PI*2;ang=a1;
    const [x0,y0]=P(a0+.025),[x1,y1]=P(a1-.025);return `<path d="M${x0},${y0} A${R},${R} 0 ${(a1-a0)>Math.PI?1:0} 1 ${x1},${y1}" fill="none" stroke="${p.col}" stroke-width="22"><title>${esc(p.n)}: ${kr(p.v)}</title></path>`}).join('');
  const monthCard=`<div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <button class="icon-btn" onclick="repOffset--;render()">${ic('left')}</button>
      <b style="text-transform:capitalize">${monthName(d.getFullYear(),d.getMonth())}</b>
      <button class="icon-btn" onclick="if(repOffset<0){repOffset++;render()}" style="${repOffset>=0?'opacity:.25':''}">${ic('right')}</button></div>
    ${tot?`<div style="display:flex;justify-content:center"><svg viewBox="0 0 200 200" width="200" height="200">${arcs}
      <text x="100" y="95" text-anchor="middle" style="fill:var(--muted);font:500 11px Inter,sans-serif">Brugt</text>
      <text x="100" y="116" text-anchor="middle" style="fill:var(--ink);font:800 19px Inter,sans-serif">${kr(tot)}</text></svg></div>
    ${parts.map(p=>`<div class="row"><div class="dot" style="background:${p.col}"></div><div class="g"><div class="t" style="font-weight:500">${esc(p.n)}</div></div><div class="s" style="color:var(--muted);font-size:13px">${Math.round(p.v/tot*100)} %</div><div class="v" style="min-width:78px;text-align:right">${kr(p.v)}</div></div>`).join('')}`
    :'<div class="empty" style="text-align:center;padding:30px 0">Ingen udgifter i denne måned.</div>'}
    <div class="mini"><div><small>Indtægt</small><b>${kr(s.inc)}</b></div><div><small>${s.left>=0?'Overskud':'Underskud'}</small><b style="color:${s.left>=0?'var(--ok)':'var(--bad)'}">${kr(s.left)}</b></div></div>
  </div>`;
  let yearCard;
  if(S.premium){
    const ms=[];for(let i=0;i<12;i++){const dm=new Date(now.getFullYear(),i,1),k=ym(dm),has=S.tx.some(t=>t.date.startsWith(k))||k===curYM;const x=month(k);ms.push({i,k,sp:(dm>now||!has)?0:x.fix+x.var})}
    const inc=incomeTotal(),max=Math.max(inc,...ms.map(x=>x.sp))*1.12||1,W=320,H=140,bw=W/12,yIn=H-inc/max*H;
    const bars=ms.map(x=>{const h=x.sp/max*H;return `<rect x="${x.i*bw+5}" y="${H-h}" width="${bw-10}" height="${h}" rx="4" fill="${x.k===curYM?'var(--brand)':x.sp>inc&&inc?'var(--bad)':'#c7c9f9'}"><title>${kr(x.sp)}</title></rect><text x="${x.i*bw+bw/2}" y="${H+14}" text-anchor="middle">${new Date(2000,x.i,1).toLocaleDateString('da-DK',{month:'narrow'})}</text>`}).join('');
    const act=ms.filter(x=>x.sp>0),ySp=act.reduce((a,b)=>a+b.sp,0);
    yearCard=`<div class="card"><div class="sec"><h2>Årsoverblik ${now.getFullYear()}</h2><span class="pro">PREMIUM</span></div>
      <svg class="chart" viewBox="0 0 ${W} ${H+20}" width="100%">${inc?`<line x1="0" x2="${W}" y1="${yIn}" y2="${yIn}" stroke="var(--ok)" stroke-dasharray="4 4" stroke-width="1.5"/>`:''}${bars}</svg>
      <div class="legend"><span><i class="dot" style="background:#c7c9f9"></i>Udgifter</span><span><i class="dot" style="background:var(--bad)"></i>Over indtægt</span><span><i style="width:14px;border-top:2px dashed var(--ok)"></i>Indtægt</span></div>
      <div class="mini"><div><small>Brugt i alt</small><b>${kr(ySp)}</b></div><div><small>Gns. pr. måned</small><b>${kr(act.length?ySp/act.length:0)}</b></div></div></div>
    <div class="card"><div class="sec"><h2>Eksport til Excel</h2><span class="pro">PREMIUM</span></div><div class="empty" style="margin-bottom:12px">Kopiér måneden, og indsæt den i Excel eller Google Sheets.</div><button class="btn sec2" onclick="exportSheet()">${ic('file')} Eksportér ${d.toLocaleDateString('da-DK',{month:'long'})}</button></div>`;
  } else yearCard=lockCard('Årsoverblik og eksport','Se hele året i ét diagram, og få dine tal ud i Excel.');
  return topbar('Rapport')+monthCard+yearCard;
}
function exportSheet(){
  const d=new Date(now.getFullYear(),now.getMonth()+repOffset,1),m=ym(d),n=v=>String(v).replace('.',',');
  const rows=[['Dato','Type','Kategori','Beskrivelse','Beløb (kr.)']];
  S.incomes.forEach(i=>rows.push([m+'-01','Indtægt',i.kind,i.name,n(i.amount)]));
  S.fixed.forEach(f=>rows.push([m+'-'+String(f.day).padStart(2,'0'),'Fast udgift','Faste udgifter',f.name,n(-f.amount)]));
  txIn(m).sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>{const c=S.cats.find(c=>c.id===t.cat);rows.push([t.date,'Køb',c?c.name:'',t.note||'',n(-t.amount)])});
  rows.push([],['','','','Tilbage',n(month(m).left)]);
  const tsv=rows.map(r=>r.map(x=>String(x).replace(/[\t\n]/g,' ')).join('\t')).join('\n');
  openSheet(`<h3>Eksport</h3><p style="color:var(--muted);font-size:14px;margin-top:-6px">Tryk Kopiér, åbn Excel, og indsæt i celle A1.</p>
  <textarea id="tsv" readonly>${esc(tsv)}</textarea><div style="display:flex;gap:10px;margin-top:12px"><button class="btn" onclick="copyTsv()">Kopiér</button><button class="btn sec2" onclick="closeSheet()">Luk</button></div>`);
}
async function copyTsv(){const ta=$('#tsv');try{await navigator.clipboard.writeText(ta.value);toast('Kopieret – indsæt i Excel')}catch(e){ta.select();toast('Markeret – tryk Ctrl/⌘+C')}}

// ================= Profil & Premium =================
function profileSheet(){
  openSheet(`<div style="display:flex;align-items:center;gap:14px;margin-bottom:18px"><div class="avatar" style="width:52px;height:52px;font-size:20px;cursor:default">${esc(initials())}</div>
    <div><div style="font-weight:700;font-size:17px">${esc(S.name||'Din profil')}</div><div style="color:var(--muted);font-size:13.5px">${user?esc(user.email||''):'Demo – gemmes kun på denne enhed'}</div></div></div>
  <div class="row" style="border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:14px"><div class="g"><div class="t">${S.premium?'KRONEN Premium':'Gratis'}</div><div class="s">${S.premium?'Alle funktioner er låst op':'1 budget · 3 kategorier · 1 sparemål'}</div></div>
    <button class="btn sm" onclick="premiumSheet()">${S.premium?'Se':'Opgrader'}</button></div>
  <form onsubmit="event.preventDefault();S.name=new FormData(this).get('n').trim();save();closeSheet();render()"><label>Dit navn<input name="n" value="${esc(S.name)}"></label><button class="btn sec2">Gem navn</button></form>
  <div style="display:flex;flex-direction:column;gap:10px;margin-top:10px">
    <button class="btn sec2" onclick="if(!S.tx.length||confirmReset('demo')){demoData(S);save();closeSheet();render();toast('Eksempeldata indlæst')}">Indlæs eksempeldata</button>
    <button class="btn sec2" style="color:var(--bad)" onclick="confirmReset('reset')">Nulstil alle data</button>
    <button class="btn line" onclick="logout()">${ic('out')} ${user?'Log ud':'Afslut demo'}</button>
  </div>`);
}
function confirmReset(kind){
  openSheet(`<h3>Er du sikker?</h3><p style="color:var(--muted);margin-top:-6px">${kind==='reset'?'Alle dine indtægter, køb og sparemål bliver slettet.':'Dine nuværende data bliver erstattet med eksempeldata.'}</p>
  <div style="display:flex;gap:10px"><button class="btn" style="background:var(--bad)" onclick="${kind==='reset'?"S=Object.assign(emptyState(S.name),{premium:S.premium});toast('Data nulstillet')":"demoData(S);toast('Eksempeldata indlæst')"};save();closeSheet();render()">Ja, fortsæt</button><button class="btn sec2" onclick="closeSheet()">Annullér</button></div>`);
  return false;
}
function premiumSheet(){
  openSheet(`<h3>KRONEN Premium</h3>
  <div style="font-size:34px;font-weight:800;letter-spacing:-.03em;margin-top:-8px">29 kr.<span style="font-size:15px;color:var(--muted);font-weight:500"> / måned</span></div>
  <div style="margin:14px 0 18px">
  ${[['star','Ubegrænsede sparemål','Spar op til flere ting på én gang'],['chart','Årsoverblik','Se hele året i ét diagram'],['bell','Påmindelser','Se hvad der trækkes de næste 7 dage'],['file','Eksport til Excel','Få dine tal ud i et regneark'],['wallet','Ubegrænsede kategorier','Gratis har 3']].map(f=>`<div class="feat"><div class="ico">${ic(f[0])}</div><div><b>${f[1]}</b><small>${f[2]}</small></div></div>`).join('')}
  </div>
  <button class="btn" onclick="S.premium=!S.premium;save();closeSheet();render();toast(S.premium?'Premium er slået til':'Du bruger nu Gratis')">${S.premium?'Skift til Gratis (demo)':'Prøv Premium (demo)'}</button>
  <p style="font-size:12px;color:var(--faint);text-align:center;margin:10px 0 0">Prototype – der trækkes ingen penge.</p>`);
}

// ================= Hjemmeskærm =================
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
let deferredPrompt=null;
function showInstall(){
  const el=$('#install'); if(!el||standalone||framed) return;
  let x=false;try{x=localStorage.getItem('kronen-install-x')}catch(e){} if(x) return;
  let html='';
  if(deferredPrompt) html=`Gem KRONEN på din hjemmeskærm <button class="btn sm" style="margin-left:auto" onclick="doInstall()">Installér</button>`;
  else if(/iphone|ipad|ipod/i.test(navigator.userAgent)) html=`<div>Gem på hjemmeskærmen: tryk ${ic('share','style="width:16px;height:16px;vertical-align:-3px"')} og vælg <b>Føj til hjemmeskærm</b>.</div>`;
  if(!html) return;
  el.innerHTML=`<div class="note info" style="gap:8px">${html}<button class="icon-btn" style="color:inherit" onclick="try{localStorage.setItem('kronen-install-x',1)}catch(e){};this.parentNode.remove()">${ic('x')}</button></div>`;
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;showInstall()});
async function doInstall(){if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$('#install').innerHTML=''}
if('serviceWorker' in navigator&&location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});

// ================= Start =================
if(hasFirebase){
  auth.getRedirectResult().catch(()=>{});
  auth.onAuthStateChanged(u=>{if(u) loadUser(u); else {user=null;S=null;renderAuth()}});
} else renderAuth();
</script>
