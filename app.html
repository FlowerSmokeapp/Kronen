<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="A simple budget app for 15–25 year olds. Your numbers stay on your phone.">
<meta name="theme-color" content="#f6f6f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1015" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Budgie">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="root"></div>
<div class="modal" id="modal"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<!-- Rækkefølgen er vigtig: indstillinger → ikoner → beregninger → lagring → app -->
<script src="js/config.js"></script>
<script src="js/icons.js"></script>

<script src="js/store.js"></script>
<script src="js/app.js"></script>

</html>
